services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ROUTER_ONNX_PATH=${ROUTER_ONNX_PATH:-./runs/classify/specialist_router/weights/best.onnx}
      - ROUTER_CONFIDENCE_THRESHOLD=${ROUTER_CONFIDENCE_THRESHOLD:-0.6}
      - ANOMALIB_MODELS_DIR=${ANOMALIB_MODELS_DIR:-./models/onnx/weights}
      - COMBINED_YOLO_ONNX_PATH=${COMBINED_YOLO_ONNX_PATH:-./models/yolo26seg/weights/best.onnx}
    volumes:
      - ./models:/app/models
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
